<p-dialog
  [header]="header"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '450px' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onCancel()"
>
  <div class="flex flex-col gap-4">
    <div class="flex items-start gap-3">
      <i class="pi pi-exclamation-triangle text-4xl text-red-500"></i>
      <div class="flex-1">
        <p class="text-gray-700 mb-2">{{ message }}</p>
        <p class="text-sm text-gray-600 mb-4">
          {{ 'SHARED.DELETE_DIALOG.CONFIRM_HINT' | translate }}
        </p>
        <input
          pInputText
          type="text"
          [(ngModel)]="confirmText"
          [placeholder]="'SHARED.DELETE_DIALOG.PLACEHOLDER' | translate"
          class="w-full"
          [class.border-red-500]="showError()"
          (keyup.enter)="onConfirm()"
        />
        @if (showError()) {
          <small class="text-red-500 mt-1 block">
            {{ 'SHARED.DELETE_DIALOG.VALIDATION' | translate }}
          </small>
        }
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'SHARED.DELETE_DIALOG.CANCEL' | translate"
        severity="secondary"
        (onClick)="onCancel()"
        [outlined]="true"
      ></p-button>
      <p-button
        [label]="'SHARED.DELETE_DIALOG.DELETE' | translate"
        severity="danger"
        (onClick)="onConfirm()"
        [disabled]="confirmText !== 'delete'"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>
