<div class="container mx-auto p-4 .max-w-5xl">
  <p-card>
    <ng-template pTemplate="header">
      <div class="p-4">
        <h2 class="text-2xl font-bold">{{ isEditMode() ? 'Edit' : 'Create' }} Debt/Loan</h2>
      </div>
    </ng-template>

    <form [formGroup]="debtForm" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div class="field md:col-span-2">
          <label for="debtType" class="block text-sm font-medium mb-2">
            Debt Type *
          </label>
          <p-select
            id="debtType"
            formControlName="debtType"
            [options]="debtTypeOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Select debt type"
            [style]="{ width: '100%' }">
          </p-select>
        </div>

        <div class="field">
          <label for="creditorName" class="block text-sm font-medium mb-2">
            Creditor Name *
          </label>
          <input
            pInputText
            id="creditorName"
            formControlName="creditorName"
            class="w-full"
            placeholder="Enter creditor name" />
        </div>

        <div class="field">
          <label for="creditorEmail" class="block text-sm font-medium mb-2">
            Creditor Email
          </label>
          <input
            pInputText
            id="creditorEmail"
            formControlName="creditorEmail"
            type="email"
            class="w-full"
            placeholder="email@example.com" />
        </div>

        <div class="field">
          <label for="creditorPhone" class="block text-sm font-medium mb-2">
            Creditor Phone
          </label>
          <input
            pInputText
            id="creditorPhone"
            formControlName="creditorPhone"
            class="w-full"
            placeholder="+1 (555) 000-0000" />
        </div>

        <div class="field">
          <label for="principalAmount" class="block text-sm font-medium mb-2">
            Principal Amount *
          </label>
          <p-inputNumber
            inputId="principalAmount"
            formControlName="principalAmount"
            mode="currency"
            currency="USD"
            [minFractionDigits]="2"
            [min]="0.01"
            class="w-full">
          </p-inputNumber>
        </div>

        <div class="field">
          <label for="interestRate" class="block text-sm font-medium mb-2">
            Interest Rate (%) *
          </label>
          <p-inputNumber
            inputId="interestRate"
            formControlName="interestRate"
            [min]="0"
            [max]="100"
            [minFractionDigits]="2"
            suffix="%"
            class="w-full">
          </p-inputNumber>
        </div>

        <div class="field">
          <label for="compoundingFrequency" class="block text-sm font-medium mb-2">
            Compounding Frequency *
          </label>
          <p-select
            id="compoundingFrequency"
            formControlName="compoundingFrequency"
            [options]="compoundingOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Select frequency"
            [style]="{ width: '100%' }">
          </p-select>
        </div>

        <div class="field">
          <label for="takenDate" class="block text-sm font-medium mb-2">
            Taken Date *
          </label>
          <p-datepicker
            id="takenDate"
            formControlName="takenDate"
            [showIcon]="true"
            dateFormat="yy-mm-dd"
            placeholder="Select date"
            [style]="{ width: '100%' }">
          </p-datepicker>
        </div>

        <div class="field">
          <label for="dueDate" class="block text-sm font-medium mb-2">
            Due Date *
          </label>
          <p-datepicker
            id="dueDate"
            formControlName="dueDate"
            [showIcon]="true"
            dateFormat="yy-mm-dd"
            placeholder="Select date"
            [style]="{ width: '100%' }">
          </p-datepicker>
        </div>

        <div class="field">
          <label for="paymentSchedule" class="block text-sm font-medium mb-2">
            Payment Schedule *
          </label>
          <p-select
            id="paymentSchedule"
            formControlName="paymentSchedule"
            [options]="paymentScheduleOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Select schedule"
            [style]="{ width: '100%' }">
          </p-select>
        </div>

        @if (branchState.showBranchPicker()) {
          <div class="field">
            <label for="branchId" class="block text-sm font-medium mb-2">
              Branch (Optional)
            </label>
            <p-select
              id="branchId"
              formControlName="branchId"
              [options]="branches()"
              optionLabel="label"
              optionValue="value"
              placeholder="Select branch"
              [style]="{ width: '100%' }">
            </p-select>
          </div>
        }

        <div class="field md:col-span-2">
          <label for="purpose" class="block text-sm font-medium mb-2">
            Purpose
          </label>
          <input
            pInputText
            id="purpose"
            formControlName="purpose"
            class="w-full"
            placeholder="Purpose of the loan" />
        </div>

        <div class="field md:col-span-2">
          <label for="collateral" class="block text-sm font-medium mb-2">
            Collateral
          </label>
          <input
            pInputText
            id="collateral"
            formControlName="collateral"
            class="w-full"
            placeholder="Collateral provided" />
        </div>

        <div class="field md:col-span-2">
          <label for="notes" class="block text-sm font-medium mb-2">
            Notes
          </label>
          <textarea
            pTextarea
            id="notes"
            formControlName="notes"
            rows="3"
            class="w-full"
            placeholder="Additional notes...">
          </textarea>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <p-button
          type="submit"
          label="{{ isEditMode() ? 'Update' : 'Create' }} Debt"
          icon="pi pi-check"
          [disabled]="debtForm.invalid || submitting()">
        </p-button>
        <p-button
          type="button"
          label="Cancel"
          icon="pi pi-times"
          severity="secondary"
          [outlined]="true"
          (onClick)="cancel()">
        </p-button>
      </div>
    </form>
  </p-card>
</div>
