<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '380px' }"
  [header]="'STUDENT_QR.TITLE' | translate"
>
  <div class="text-center">
    <p class="text-sm text-gray-500 mb-2">{{ studentName() }}</p>

    <!-- Short student code — the QR-less fallback for attendance / payment. -->
    @if (student()?.studentCode != null) {
      <div class="mb-3 inline-flex items-center gap-2 text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-full px-3 py-1">
        <i class="pi pi-hashtag"></i>
        <span>{{ 'STUDENT_QR.CODE_LABEL' | translate }} <strong>{{ student()?.studentCode }}</strong></span>
      </div>
    }

    @if (dataUrl()) {
      <img [src]="dataUrl()" alt="QR code" class="mx-auto rounded-lg border border-gray-200" style="width: 260px; height: 260px;" />
    } @else {
      <div class="flex items-center justify-center text-gray-300" style="width: 260px; height: 260px; margin: 0 auto;">
        <i class="pi pi-spin pi-spinner text-3xl"></i>
      </div>
    }

    <p class="text-xs text-gray-400 mt-3">{{ 'STUDENT_QR.SCAN_HINT' | translate }}</p>

    <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
      <p-button icon="pi pi-print" [label]="'STUDENT_QR.PRINT' | translate" size="small" [outlined]="true" (onClick)="print()" [disabled]="!dataUrl()"></p-button>
      <p-button icon="pi pi-download" [label]="'STUDENT_QR.DOWNLOAD' | translate" size="small" [outlined]="true" (onClick)="download()" [disabled]="!dataUrl()"></p-button>
    </div>

    <!-- Click-to-chat: send from the staff member's own WhatsApp number -->
    <div class="flex items-center justify-center gap-2 mt-2 flex-wrap">
      <p-button icon="pi pi-whatsapp" [label]="'STUDENT_QR.SEND_QR_STUDENT' | translate" size="small" severity="success" (onClick)="sendQrToStudent()" [disabled]="!dataUrl()"></p-button>
      <p-button icon="pi pi-whatsapp" [label]="'STUDENT_QR.SEND_FOLLOWUP_PARENT' | translate" size="small" severity="success" [outlined]="true" (onClick)="sendFollowupToParent()" [disabled]="!dataUrl()"></p-button>
    </div>
  </div>
</p-dialog>
