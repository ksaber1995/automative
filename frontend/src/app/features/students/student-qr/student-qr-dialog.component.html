<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '380px' }"
  [header]="'STUDENT_QR.TITLE' | translate"
>
  <div class="text-center">
    <p class="text-sm text-gray-500 mb-3">{{ studentName() }}</p>

    @if (dataUrl()) {
      <img [src]="dataUrl()" alt="QR code" class="mx-auto rounded-lg border border-gray-200" style="width: 260px; height: 260px;" />
    } @else {
      <div class="flex items-center justify-center text-gray-300" style="width: 260px; height: 260px; margin: 0 auto;">
        <i class="pi pi-spin pi-spinner text-3xl"></i>
      </div>
    }

    <p class="text-xs text-gray-400 mt-3">{{ 'STUDENT_QR.SCAN_HINT' | translate }}</p>

    <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
      <p-button icon="pi pi-print" [label]="'STUDENT_QR.PRINT' | translate" size="small" [outlined]="true" (onClick)="print()" [disabled]="!dataUrl()"></p-button>
      <p-button icon="pi pi-download" [label]="'STUDENT_QR.DOWNLOAD' | translate" size="small" [outlined]="true" (onClick)="download()" [disabled]="!dataUrl()"></p-button>
      <p-button icon="pi pi-refresh" [label]="'STUDENT_QR.REGENERATE' | translate" size="small" severity="danger" [outlined]="true" (onClick)="regenerate()" [loading]="regenerating()"></p-button>
    </div>
  </div>
</p-dialog>
