<div class="p-4">
  <app-wa-nav></app-wa-nav>
  <div class="mb-4">
    <h1 class="text-2xl font-bold text-gray-800">{{ 'WA.TEMPLATES_TITLE' | translate }}</h1>
    <p class="text-sm text-gray-500">{{ 'WA.TEMPLATES_SUBTITLE' | translate }}</p>
  </div>

  @if (loading()) {
    <div class="text-center text-gray-400 py-10"><i class="pi pi-spin pi-spinner text-2xl"></i></div>
  } @else {
    <div class="flex flex-col gap-3">
      @for (k of keys; track k) {
        <p-card>
          <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-gray-800">{{ keyLabel(k) }}</span>
              <p-tag [value]="(isMarketing(k) ? 'WA.CAT_MARKETING' : 'WA.CAT_UTILITY') | translate" [severity]="isMarketing(k) ? 'warn' : 'info'"></p-tag>
            </div>
            <p-button icon="pi pi-check" [label]="'WA.SAVE' | translate" size="small" (onClick)="save(k)" [loading]="savingKey() === k"></p-button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-gray-500 mb-1">{{ 'WA.META_TEMPLATE_NAME' | translate }}</label>
              <input pInputText [(ngModel)]="forms[k].metaTemplateName" class="w-full" placeholder="e.g. absence_notification" />
            </div>
          </div>
          <div class="mt-2">
            <label class="block text-xs text-gray-500 mb-1">{{ 'WA.BODY' | translate }}</label>
            <textarea pTextarea [(ngModel)]="forms[k].body" rows="3" class="w-full" [placeholder]="'WA.BODY_PLACEHOLDER' | translate"></textarea>
          </div>
        </p-card>
      }
    </div>
  }
</div>
