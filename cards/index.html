<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cards · per-client report</title>
  <style>
    /* ---- palette (light + dark), roles not raw hex ---- */
    :root {
      color-scheme: light;
      --page:        #f9f9f7;
      --surface:     #fcfcfb;
      --text:        #0b0b0b;
      --text-2:      #52514e;
      --muted:       #898781;
      --grid:        #e1e0d9;
      --border:      rgba(11,11,11,0.10);
      --linked:      #2a78d6;  /* blue — cards handed out */
      --unlinked:    #c9c8c1;  /* neutral — still in the pool */
      --good:        #0ca30c;
      --shadow:      0 1px 2px rgba(11,11,11,0.04), 0 1px 12px rgba(11,11,11,0.03);
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --page:      #0d0d0d;
        --surface:   #1a1a19;
        --text:      #ffffff;
        --text-2:    #c3c2b7;
        --muted:     #898781;
        --grid:      #2c2c2a;
        --border:    rgba(255,255,255,0.10);
        --linked:    #3987e5;
        --unlinked:  #3a3a37;
        --shadow:    none;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --text: #fff; --text-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --linked: #3987e5; --unlinked: #3a3a37; --shadow: none;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--page); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.45;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 64px; }

    header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
    .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
    .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); cursor: pointer; user-select: none; }
    button.refresh {
      font: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer;
    }
    button.refresh:hover { border-color: var(--muted); }
    button.refresh:disabled { opacity: .5; cursor: default; }

    /* ---- KPI stat tiles ---- */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 26px 0 10px; }
    @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; box-shadow: var(--shadow);
    }
    .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .kpi .value { font-size: 30px; font-weight: 650; margin-top: 6px; letter-spacing: -0.02em; }
    .kpi .note { color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .kpi .value .unit { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 4px; }

    /* ---- global pool split bar ---- */
    .poolbar-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-top: 14px; box-shadow: var(--shadow); }
    .poolbar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .poolbar-head .t { font-size: 13px; font-weight: 600; }
    .legend { display: flex; gap: 16px; color: var(--text-2); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .dot.l { background: var(--linked); }
    .dot.u { background: var(--unlinked); }
    .poolbar { display: flex; height: 16px; border-radius: 5px; overflow: hidden; gap: 2px; background: transparent; }
    .poolbar i { display: block; height: 100%; }
    .poolbar i.l { background: var(--linked); border-radius: 5px 2px 2px 5px; }
    .poolbar i.u { background: var(--unlinked); border-radius: 2px 5px 5px 2px; }

    /* ---- table ---- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-top: 22px; overflow: hidden; box-shadow: var(--shadow); }
    .tscroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { padding: 11px 16px; text-align: left; white-space: nowrap; }
    thead th {
      color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
      border-bottom: 1px solid var(--grid); cursor: pointer; user-select: none;
    }
    thead th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
    thead th .arrow { color: var(--linked); font-size: 10px; }
    tbody tr { border-bottom: 1px solid var(--grid); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: color-mix(in srgb, var(--muted) 8%, transparent); }
    td.name { font-weight: 550; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); }
    .off { color: var(--muted); }
    .minibar { display: inline-flex; height: 8px; width: 90px; gap: 2px; vertical-align: middle; border-radius: 4px; overflow: hidden; }
    .minibar i { height: 100%; }
    .minibar i.l { background: var(--linked); }
    .minibar i.u { background: var(--unlinked); }
    tfoot td { font-weight: 650; border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }

    .state { padding: 40px 16px; text-align: center; color: var(--text-2); }
    .state.err { color: #d03b3b; }
    a.link { color: var(--linked); }
    .foot { margin-top: 18px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Cards · per-client report</h1>
        <div class="sub">Cards generated per active (paying) client, and the QR pool split (linked vs unlinked).</div>
      </div>
      <div class="controls">
        <label class="toggle"><input type="checkbox" id="onlyWithCards" checked /> Only clients with cards</label>
        <button class="refresh" id="refresh">Refresh</button>
      </div>
    </header>

    <section class="kpis" id="kpis" hidden>
      <div class="kpi"><div class="label">Active clients</div><div class="value" id="k-clients">–</div><div class="note" id="k-clients-note"></div></div>
      <div class="kpi"><div class="label">Cards generated</div><div class="value" id="k-total">–</div><div class="note">across the QR pool</div></div>
      <div class="kpi"><div class="label">Linked</div><div class="value" id="k-linked">–</div><div class="note" id="k-linked-note"></div></div>
      <div class="kpi"><div class="label">Unlinked</div><div class="value" id="k-unlinked">–</div><div class="note">still in the pool</div></div>
    </section>

    <section class="poolbar-wrap" id="poolbarWrap" hidden>
      <div class="poolbar-head">
        <span class="t">QR pool</span>
        <span class="legend">
          <span><span class="dot l"></span>Linked</span>
          <span><span class="dot u"></span>Unlinked</span>
        </span>
      </div>
      <div class="poolbar" id="poolbar"></div>
    </section>

    <div class="card" id="tableCard" hidden>
      <div class="tscroll">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Client</th>
              <th data-sort="type">Type</th>
              <th class="num" data-sort="total">Cards generated</th>
              <th class="num" data-sort="linked">Linked</th>
              <th class="num" data-sort="unlinked">Unlinked</th>
              <th>Split</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </div>

    <div class="state" id="state">Loading…</div>
    <div class="foot" id="foot"></div>
  </div>

  <script>
    // Live, unauthenticated owner endpoint — same one the admin console uses.
    // The obscure path is the only gate; it returns aggregate numbers + company
    // names. CORS is locked to an allowlist, so serve this page on
    // http://localhost:4800 (see README).
    const ADMIN_ENDPOINT =
      'https://xnbgr057y1.execute-api.eu-west-1.amazonaws.com/prod/api/karim-admin-secret';

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Number(n || 0).toLocaleString();

    let rows = [];                    // per active client, enriched with pool stats
    let sort = { key: 'total', dir: -1 };

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText} — ${url}`);
      return res.json();
    }

    // Run promise-returning tasks with a small concurrency cap, gently.
    async function pooled(items, limit, task) {
      const out = new Array(items.length);
      let i = 0;
      const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (i < items.length) {
          const idx = i++;
          out[idx] = await task(items[idx], idx);
        }
      });
      await Promise.all(workers);
      return out;
    }

    async function load() {
      const btn = $('refresh');
      btn.disabled = true;
      $('state').className = 'state';
      $('state').textContent = 'Loading clients…';
      [$('kpis'), $('poolbarWrap'), $('tableCard')].forEach((el) => (el.hidden = true));

      try {
        const companies = await fetchJson(ADMIN_ENDPOINT);
        // "Active client" = a paying, active subscription (not trial, not expired).
        const active = companies.filter((c) => c.subscription_type === 'ACTIVE');

        $('state').textContent = `Reading card pools for ${active.length} active clients…`;

        rows = await pooled(active, 6, async (c) => {
          let total = 0, linked = 0, enabled = false;
          try {
            const s = await fetchJson(`${ADMIN_ENDPOINT}/companies/${c.company_id}/qr-cards`);
            total = Number(s.total || 0);
            linked = Number(s.linked || 0);
            enabled = s.qr_cards_enabled === true;
          } catch (_) { /* leave zeros if a single client fails */ }
          return {
            name: c.company_name || '(unnamed)',
            type: c.company_type || '—',
            enabled,
            total,
            linked,
            unlinked: Math.max(0, total - linked),
          };
        });

        render();
        $('foot').innerHTML =
          `Active (paying) clients only. Cards generated = size of a client's QR pool; linked = handed out to a student, ` +
          `unlinked = still free. Source: <span class="off">/api/karim-admin-secret</span>. ` +
          `Updated ${new Date().toLocaleTimeString()}.`;
      } catch (err) {
        $('state').className = 'state err';
        $('state').textContent = `Could not load: ${err.message}. ` +
          `If this is a CORS error, serve the page on http://localhost:4800 (see README).`;
      } finally {
        btn.disabled = false;
      }
    }

    function render() {
      const onlyWith = $('onlyWithCards').checked;
      const shown = onlyWith ? rows.filter((r) => r.total > 0) : rows.slice();

      // KPI tiles — computed over active clients (the pool split reflects shown set).
      const withCards = rows.filter((r) => r.total > 0).length;
      const sum = shown.reduce((a, r) => ({
        total: a.total + r.total, linked: a.linked + r.linked, unlinked: a.unlinked + r.unlinked,
      }), { total: 0, linked: 0, unlinked: 0 });

      $('k-clients').textContent = fmt(rows.length);
      $('k-clients-note').textContent = `${fmt(withCards)} with cards`;
      $('k-total').textContent = fmt(sum.total);
      $('k-linked').textContent = fmt(sum.linked);
      $('k-linked-note').textContent = sum.total ? `${Math.round((sum.linked / sum.total) * 100)}% of pool` : '';
      $('k-unlinked').textContent = fmt(sum.unlinked);

      // Global split bar
      const lp = sum.total ? (sum.linked / sum.total) * 100 : 0;
      $('poolbar').innerHTML =
        `<i class="l" style="width:${lp}%" title="Linked: ${fmt(sum.linked)}"></i>` +
        `<i class="u" style="width:${100 - lp}%" title="Unlinked: ${fmt(sum.unlinked)}"></i>`;

      // Sort
      shown.sort((a, b) => {
        const A = a[sort.key], B = b[sort.key];
        const cmp = typeof A === 'string' ? A.localeCompare(B) : (A - B);
        return cmp * sort.dir;
      });

      // Rows
      $('tbody').innerHTML = shown.map((r) => {
        const lp = r.total ? (r.linked / r.total) * 100 : 0;
        const bar = r.total
          ? `<span class="minibar"><i class="l" style="width:${lp}%"></i><i class="u" style="width:${100 - lp}%"></i></span>`
          : '<span class="off">—</span>';
        return `<tr>
          <td class="name" title="${esc(r.name)}">${esc(r.name)}</td>
          <td><span class="badge">${esc(r.type)}</span>${r.enabled ? '' : ' <span class="off" title="QR pool disabled">off</span>'}</td>
          <td class="num">${fmt(r.total)}</td>
          <td class="num">${fmt(r.linked)}</td>
          <td class="num">${fmt(r.unlinked)}</td>
          <td>${bar}</td>
        </tr>`;
      }).join('');

      $('tfoot').innerHTML = `<tr>
        <td>${shown.length} client${shown.length === 1 ? '' : 's'}</td><td></td>
        <td class="num">${fmt(sum.total)}</td>
        <td class="num">${fmt(sum.linked)}</td>
        <td class="num">${fmt(sum.unlinked)}</td><td></td>
      </tr>`;

      // Sort arrows
      document.querySelectorAll('thead th[data-sort]').forEach((th) => {
        const base = th.textContent.replace(/[▲▼]\s*$/, '').trim();
        th.innerHTML = base + (th.dataset.sort === sort.key
          ? ` <span class="arrow">${sort.dir < 0 ? '▼' : '▲'}</span>` : '');
      });

      $('state').textContent = shown.length ? '' : 'No clients to show with the current filter.';
      $('state').className = 'state';
      $('kpis').hidden = false;
      $('poolbarWrap').hidden = false;
      $('tableCard').hidden = shown.length === 0;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    document.querySelectorAll('thead th[data-sort]').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sort.key === key) sort.dir *= -1;
        else sort = { key, dir: key === 'name' || key === 'type' ? 1 : -1 };
        render();
      });
    });
    $('onlyWithCards').addEventListener('change', render);
    $('refresh').addEventListener('click', load);

    load();
  </script>
</body>
</html>
