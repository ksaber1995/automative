name: netrofit_app
description: "Netrofit mobile — parent follow-up and student exams."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  mobile_scanner: ^7.0.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^20.1.0
  workmanager: 0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# The launcher icon — the Netrofit logo on its own navy. Regenerate after
# changing the sources with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#031C34"
  adaptive_icon_foreground: assets/icon/icon_fg.png
dependency_overrides:
  workmanager_platform_interface: 0.9.0
  workmanager_android: 0.9.0
  workmanager_apple: 0.9.0
